<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTスーパーズコApp</title>
<style>
  html, body { margin:0; background:#2C7A99; }
  /* ★2026-10-29 トマトさん報告「No31で金額を入力中、画面がどんどん大きくなる（iPhone）」。
     iPhoneは同じ所を素早く2回たたくと拡大する＝数字ボタンで「00」などを打つと拡大していた。
     ボタン類だけ2回たたきの拡大を止める（指2本で広げる拡大はそのまま使える）。全画面共通。 */
  /* ★同日まるちゃん「ズコアプリのすべてに適用して」＝ボタンだけでなく表の行・カードなど押せる所すべてに広げた。 */
  * { touch-action: manipulation; }
  #root { min-height:100vh; }
  .boot { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    color:#fff; opacity:.85; font-family:"Segoe UI","Hiragino Sans",system-ui,sans-serif; }
  /* ★2026-08-13：待ち画面のズコが出ず「空っぽの四角」だけ見える、とまるちゃん指摘。
     原因は2つ。①絵が icons/icon-512.png(265KB)で届くまで間があった → 見た目そのままで31KBに
     軽くした zuko-boot.png に差し替え。②届く前でも影(box-shadow)のせいで四角の枠だけ見えていた
     → 絵が届いて .ok が付くまで影を出さない（届くまでは何も無いように見える）。 */
  .bootIcon { width:min(60vw,260px); height:min(60vw,260px); border-radius:20%; box-shadow:none; }
  .bootIcon.ok { box-shadow:0 6px 20px rgba(0,0,0,.3); }
  .bootText { font-size:26px; font-weight:800; }
  .bootTextLg { font-size:min(11vw,50px); font-weight:800; text-align:center; line-height:1.35; padding:0 20px; }
  /* 名前選択（スタッフURLで初回のみ） */
  .pkwrap{ max-width:520px; margin:0 auto; padding:34px 18px; color:#fff;
    font-family:"Segoe UI","Hiragino Sans",system-ui,sans-serif; text-align:center; }
  .pktitle{ font-size:30px; font-weight:800; margin-bottom:22px; line-height:1.5; }
  .pkgrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .pk{ background:#fff; color:#155e75; border:0; border-radius:14px; padding:22px 10px;
    font-size:24px; font-weight:800; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .pk:active{ transform:scale(.97); }
  .pkbtns{ display:flex; gap:12px; justify-content:center; margin-top:6px; }
  .pkyes,.pkno{ border:0; border-radius:12px; padding:20px 36px; font-size:24px; font-weight:800; cursor:pointer; }
  .pkyes{ background:#16a34a; color:#fff; } .pkno{ background:#e5e7eb; color:#333; }
  .pknote{ margin-top:20px; font-size:12.5px; opacity:.82; line-height:1.7; }
  /* 合言葉（スタッフURLで初回のみ・名前選択より前に出す） */
  .pwinput2{ font-size:26px; text-align:center; padding:16px 14px; border-radius:14px; border:0;
    width:100%; max-width:280px; box-sizing:border-box; margin:0 auto 16px; display:block; }
  .pwgo{ background:#16a34a; color:#fff; border:0; border-radius:12px; padding:18px 40px;
    font-size:22px; font-weight:800; cursor:pointer; }
  .pwgo:active{ transform:scale(.97); }
  .pwgo:disabled{ opacity:.6; }
  .pwerr{ margin-top:16px; font-size:15px; color:#ffd7d7; min-height:1.4em; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ★★2026-10-18 まるちゃん「すぐやって」：グーグルの窓口への問い合わせ全部に「合言葉から作った印」を自動で添える。
//   それまでは、このページの中身（誰でも見られる公開の置き場）に窓口の住所と鍵が書いてあり、
//   合言葉なしで予約一覧・未回答のLINE・売上を誰でも取れた。窓口が印を確かめるようにしたので、
//   ここで全部の問い合わせ（画面の数に関係なく1か所）に印を付ける。印はパスワードを入れた端末にだけある。
//   ・印＝合言葉から計算した文字（合言葉そのものは送らない・この端末に覚える）。
//   ・パソコン版ズコは開く住所に印を付けて渡してくる（?zk=…）。
//   ・合言葉が変わって印が古くなったら、窓口がそう返す→印を消してもう一度パスワードを聞く。
// ★★2026-10-18 午後 まるちゃん「スタッフはもう名前でスマホに入っているから合言葉はいらない。データを渡す道に
//   すごい鍵を」→ スマホ1台ごとの鍵に変えた。
//   ・この端末の番号（zk_dv）と鍵（zk_dk）を窓口からもらって覚え、問い合わせ全部に添える。
//   ・初めてのスマホは、りゅうさんが許可するまで「許可待ち」の画面だけを出す（合言葉は聞かない）。
//   ・パソコン版ズコは開く住所に、このPC用の鍵（?zdv=…&zdk=…）を付けて渡してくる。
//   ・合言葉の印（zk_tk）は切り替えの間だけ一緒に添える（窓口で受け付けを止めたら使われなくなる）。
(function () {
  var LS_TK = 'zk_tk', LS_DV = 'zk_dv', LS_DK = 'zk_dk';
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbzSxho3e4CHyAuoymGlzcVwGnLshGoCg53zY18laLrHMq5Cun_pBv8XgRsNxKMDxlKwUA/exec';
  function g(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function s(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function rm(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function newDv() {
    var a = new Uint8Array(12);
    try { crypto.getRandomValues(a); } catch (e) { for (var i = 0; i < 12; i++) a[i] = Math.floor(Math.random() * 256); }
    var h = Array.prototype.map.call(a, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    s(LS_DV, h); return h;
  }
  try {
    var q = new URLSearchParams(location.search);
    var zk = q.get('zk'), zdv = q.get('zdv'), zdk = q.get('zdk');
    if (zk && /^[0-9a-f]{32}$/.test(zk)) { s(LS_TK, zk); s('sz_pw_ok', '1'); }
    if (zdv && zdk && /^[0-9a-f]{24}$/.test(zdv) && /^[0-9a-f]{32}$/.test(zdk)) { s(LS_DV, zdv); s(LS_DK, zdk); }
  } catch (e) {}
  if (!/^[0-9a-f]{24}$/.test(g(LS_DV))) { newDv(); rm(LS_DK); }
  var EXEC_RE = /^https:\/\/script\.google\.com\/macros\/s\/AKfycbzSxho3e4CH[^\/?]*\/exec/;
  function add(u) {
    u = String(u);
    if (!EXEC_RE.test(u)) return u;
    var dk = g(LS_DK), t = g(LS_TK);
    if (dk && !/[?&]dk=/.test(u)) u += (u.indexOf('?') < 0 ? '?' : '&') + 'dv=' + g(LS_DV) + '&dk=' + dk;
    if (t && !/[?&]tk=/.test(u)) u += (u.indexOf('?') < 0 ? '?' : '&') + 'tk=' + t;
    return u;
  }
  window.__zkAddTk = add;
  window.__ZK_NEED_PW = false;
  // 状態：ok＝鍵あり／tk＝合言葉の印だけ（切り替えの間）／need＝まだ何も無い（確認中）／pending＝許可待ち
  var st = g(LS_DK) ? 'ok' : (g(LS_TK) ? 'tk' : 'need');
  var code = g(LS_DV).slice(-4).toUpperCase();
  window.__zkBlocked = function () { return st === 'need' || st === 'pending'; };

  function ask(cb) {
    var name = '__zkDev' + Date.now();
    window[name] = function (r) { try { delete window[name]; } catch (e) {} cb(r || {}); };
    var ua = navigator.userAgent || '';
    var kind = /iPhone|iPad|iPod/.test(ua) ? 'iPhone' : (/Android/.test(ua) ? 'Android' : 'PC');
    var sp = new URLSearchParams(location.search);
    var role = g('sz_role') || (sp.get('staff') === '1' ? 'スタッフ' : (sp.get('dev') === '1' ? '開発' : '社長(幹部)'));
    var u = EXEC_URL + '?action=devkey&dv=' + g(LS_DV) + (g(LS_DK) ? '&dk=' + g(LS_DK) : '')
      + '&device=' + encodeURIComponent(g('sz_device')) + '&who=' + encodeURIComponent(g('sz_who'))
      + '&role=' + encodeURIComponent(role) + '&kind=' + kind
      + (g(LS_TK) ? '&tk=' + g(LS_TK) : '') + '&callback=' + name + '&cb=' + Date.now();
    var el = document.createElement('script');
    el.onerror = function () { cb({ ok: false, error: 'net' }); };
    el.src = u;
    (document.head || document.documentElement).appendChild(el);
  }
  var polling = false;
  function poll() {
    if (polling) return; polling = true;
    (function tick() {
      setTimeout(function () {
        ask(function (r) {
          if (r.dk) s(LS_DK, r.dk);
          if (r.state === 'ok') { location.reload(); return; }
          tick();
        });
      }, 15000);
    })();
  }
  window.__zkShowWait = function () {
    var root = document.getElementById('root');
    if (!root) return;
    try { window.__btDone && window.__btDone('許可待ち'); } catch (e) {}
    root.innerHTML = '<div class="pkwrap" style="text-align:center"><div class="pktitle">'
      + (st === 'need' ? '確認しています…' : 'このスマホは、まだ<br>ズコに登録されていません')
      + '</div>'
      + (st === 'need' ? '' : '<div style="color:#fff;font-size:18px;line-height:1.7;margin-top:12px">'
        + 'りゅうさんが許可すると、自動で開きます。<br>このまま少し待っててくださいね🥺</div>'
        + '<div style="color:#fff;font-size:22px;font-weight:700;margin-top:18px">画面の番号：' + code + '</div>')
      + '</div>';
    if (st === 'pending') poll();
  };
  function settle(r, prev) {
    if (r.dk) s(LS_DK, r.dk);
    if (r.state === 'ok') { st = 'ok'; if (prev === 'need' || prev === 'pending') location.reload(); return; }
    if (r.state === 'pending') { st = (prev === 'tk') ? 'tk' : 'pending'; if (st === 'pending') window.__zkShowWait(); return; }
    if (r.state === 'taken') { newDv(); rm(LS_DK); code = g(LS_DV).slice(-4).toUpperCase(); ask(function (r2) { settle(r2, prev); }); return; }
    if (prev === 'need') { st = 'pending'; window.__zkShowWait(); }   // 通信に失敗＝許可待ちの画面で待つ
  }
  if (st !== 'ok') { var prev0 = st; ask(function (r) { settle(r, prev0); }); }

  window.__zkAuthFail = function () {
    if (st === 'need' || st === 'pending') return;      // 確認中・許可待ちの画面が出ている
    try { if (sessionStorage.getItem('zk_fail_once')) return; sessionStorage.setItem('zk_fail_once', '1'); } catch (e) {}
    rm(LS_TK); rm('sz_pw_ok');
    if (!g(LS_DK)) { location.reload(); return; }
    ask(function (r) {
      if (r.dk) s(LS_DK, r.dk);
      if (r.state === 'ok') { location.reload(); return; }
      if (r.state === 'taken') { newDv(); rm(LS_DK); location.reload(); return; }
      st = 'pending'; window.__zkShowWait();
    });
  };
  try {
    var d = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
    Object.defineProperty(HTMLScriptElement.prototype, 'src', {
      configurable: true, enumerable: d.enumerable,
      get: function () { return d.get.call(this); },
      set: function (v) { d.set.call(this, add(v)); }
    });
    var sa = Element.prototype.setAttribute;
    Element.prototype.setAttribute = function (n, v) {
      if (this instanceof HTMLScriptElement && String(n).toLowerCase() === 'src') v = add(v);
      return sa.call(this, n, v);
    };
  } catch (e) {}
  if (window.fetch) {
    var f0 = window.fetch;
    window.fetch = function (i, o) { if (typeof i === 'string') i = add(i); return f0.call(this, i, o); };
  }
  // 合言葉から印を作る（端末の中だけで計算）。
  window.__zkMakeTk = function (pw) {
    var b = new TextEncoder().encode('zuko|' + pw);
    return crypto.subtle.digest('SHA-256', b).then(function (h) {
      return Array.prototype.map.call(new Uint8Array(h), function (x) { return ('0' + x.toString(16)).slice(-2); })
        .join('').slice(0, 32);
    });
  };
})();
</script>
<script>
// ★2026-09-14 まるちゃん依頼：「開いてから画面が出るまで何秒・どこで待ったか」を人ごとに記録する。
//   きっかけ＝TOMATOさんのiPhoneだけ「ズコは少し遠出かも...」が長く出る（開発者のAndroidは速い）。
//   ここで開き始めを控え、段階ごとに端末へ書き足す。画面が出たら1件の記録にして貯め、
//   数分に1回まとめて事務所PCへ送る（下の btSend_）。途中で閉じた回は、次に開いた時に
//   「どこまで進んでいたか」付きで送る＝原因が追える。画面の見た目は一切変えない。
(function () {
  var LS_OPEN = 'sz_bt_open', LS_Q = 'sz_bt_q';
  function g(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function s(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  var ua = navigator.userAgent || '';
  var kind = /iPhone|iPad|iPod/.test(ua) ? 'iPhone' : (/Android/.test(ua) ? 'Android' : 'PC');
  var app = (navigator.standalone === true ||
             (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) ? 'アイコン' : 'ブラウザ';
  var view = (new URLSearchParams(location.search)).get('view') || 'home';
  // 前回、画面が出る前に閉じられていたら「途中で閉じた」として貯める。
  try {
    var prev = g(LS_OPEN);
    if (prev) {
      var p = JSON.parse(prev); p.r = '途中で閉じた';
      var q0 = JSON.parse(g(LS_Q) || '[]'); q0.push(p); s(LS_Q, JSON.stringify(q0.slice(-40)));
    }
  } catch (e) {}
  var bt = window.__BT = { at: new Date().toISOString(), v: view, k: kind, a: app, st: '入口', h: 0,
                           sw: (navigator.serviceWorker && navigator.serviceWorker.controller) ? '有' : '無' };
  try {
    var nav = performance.getEntriesByType('navigation')[0];
    if (nav) {
      bt.e = Math.round(nav.responseEnd);
      bt.w = nav.workerStart ? Math.round(Math.max(0, nav.fetchStart - nav.workerStart)) : 0;
      bt.nt = nav.type;
    }
  } catch (e) {}
  var hidAt = document.visibilityState === 'hidden' ? performance.now() : null;
  document.addEventListener('visibilitychange', function () {
    if (bt.done) return;
    if (document.visibilityState === 'hidden') hidAt = performance.now();
    else if (hidAt !== null) { bt.h += Math.round(performance.now() - hidAt); hidAt = null; }
  });
  window.__btMark = function (stage, key) {
    if (bt.done) return;
    bt.st = stage;
    if (key) bt[key] = Math.round(performance.now());
    s(LS_OPEN, JSON.stringify(bt));
  };
  window.__btDone = function (result) {
    if (bt.done) return;
    if (hidAt !== null) { bt.h += Math.round(performance.now() - hidAt); hidAt = null; }
    bt.sh = Math.round(performance.now()); bt.r = result; bt.st = '表示';
    try {
      // ★2026-11-08：本体は部品に分けて読む（parts/）。受け取りにかかった分＝部品全部の最初から最後まで。
      var ces = performance.getEntriesByType('resource').filter(function (x) { return /\/code\.js|\/parts\//.test(x.name); });
      if (ces.length) {
        var c0 = Infinity, c1 = 0;
        for (var ci = 0; ci < ces.length; ci++) { c0 = Math.min(c0, ces[ci].startTime); c1 = Math.max(c1, ces[ci].responseEnd); }
        bt.c = Math.round(c1 - c0);
      }
    } catch (e) {}
    bt.pt = window.__SZ_PT_ || '';   // 部品だけ読んだか（parts）・丸ごと読んだか（full）
    var rec = {}; for (var k in bt) if (k !== 'done') rec[k] = bt[k];
    bt.done = true;
    try { var q = JSON.parse(g(LS_Q) || '[]'); q.push(rec); s(LS_Q, JSON.stringify(q.slice(-40))); } catch (e) {}
    try { localStorage.removeItem(LS_OPEN); } catch (e) {}
    if (window.__btSend) setTimeout(window.__btSend, 4000);   // 画面の読み込みと取り合わないよう少し後で
  };
  s(LS_OPEN, JSON.stringify(bt));
})();
</script>
<script>
(function () {
  // 待ち画面はどちらも金魚（ズコ）にそろえる（まるちゃん指示 2026-08-12）。
  //   ホーム(view無し)＝「ズコは少し遠出かも...」／ボタン後の画面(?view=… 付き)＝「ズコがお散歩中...」。
  //   ＝はじめ「お散歩中」、読み込みが長引いて自動でホームに戻った時に「少し遠出かも...」になる。
  var view = (new URLSearchParams(location.search)).get('view') || 'home';
  var root = document.getElementById('root');
  if (view === 'home') {
    root.innerHTML = '<div class="boot"><div class="bootText">ズコは少し遠出かも...</div><img src="icons/zuko-boot.png" alt="" class="bootIcon" onload="this.className+=\' ok\'"></div>';
  } else {
    root.innerHTML = '<div class="boot"><div class="bootText">ズコがお散歩中...</div><img src="icons/zuko-boot.png" alt="" class="bootIcon" onload="this.className+=\' ok\'"></div>';
  }
  // ★2026-09-14 まるちゃん「ながいまちのときはズコを遠出にするんじゃなかったっけ？でなかったよ」。
  //   「遠出」は8/12に外した"8秒でホームへ戻す保険"とセットで出ていたので、保険と一緒に出なくなっていた。
  //   → 画面は奪わず、8秒たってもまだ待ち画面なら文言だけ「少し遠出かも...」に変える（全ボタン共通）。
  setTimeout(function () {
    var t = root.querySelector('.boot .bootText');
    if (t) t.textContent = 'ズコは少し遠出かも...';
  }, 8000);
})();
</script>

<!-- 判定コア(detect)と、GASと共通の描画関数(renderHome_/renderPage_/personPerms_ など)。
     どちらも純JS。GAS専用の関数(doGet等)は同梱されるが呼ばれないだけ。
     ★?v=... はキャッシュ避け（GitHub PagesがCache-Control: max-age=600を付けるため、
     コード更新のたびにここの番号を上げないとスマホが古いJSを最大10分キャッシュし続ける）。
     更新手順：code.js/detect_core.jsを直したら、この2行の?v=も必ず同じ値へ上げてからpushする。 -->
<!-- ★被り画面の初期表示を最速化：events(被りデータ)と tilesettings(権限)の取得を、重い
     detect_core.js/code.js の読み込みより「前」に発射する（約0.6秒早くスタート）。結果はグローバルに
     貯め、下の本体スクリプトが code 読み込み後に拾って描画/起動する（発射だけなので code 不要）。 -->
<script>
(function () {
  var EXEC = "https://script.google.com/macros/s/AKfycbzSxho3e4CHyAuoymGlzcVwGnLshGoCg53zY18laLrHMq5Cun_pBv8XgRsNxKMDxlKwUA/exec";
  var view = (new URLSearchParams(location.search)).get('view') || 'home';

  // ★2026-09-16：事務所パソコンの窓（中身はこのページ）は、ページの読み込みが「全部終わってから」でないと
  //   手元のデータを渡してこられない。グーグルへの問い合わせを読み込み中に出すと、返事が来るまで（3〜11秒）
  //   読み込みが終わらず、手元のデータも渡せなかった。→ パソコンの窓の中だけ、問い合わせを読み込み後に出す。
  //   （見分け＝パソコンの窓にだけある印。スマホ・普通のブラウザは今までどおりすぐ出す）
  var PC_WINDOW = !!(window.chrome && window.chrome.webview);
  function sendLater_(el) {
    if (!PC_WINDOW || document.readyState === 'complete') { document.head.appendChild(el); return; }
    window.addEventListener('load', function () { setTimeout(function () { document.head.appendChild(el); }, 0); });
  }

  // tilesettings（権限・名前選択に必要＝全画面で使う）
  window.__tsResult = undefined; window.__tsWaiter = null;
  window.__ttTileSettingsPre = function (payload) {
    try { if (window.__BT && window.__BT.cm === undefined) window.__BT.cm = Math.round(performance.now()); } catch (e) {}
    window.__tsResult = payload || {};
    var w = window.__tsWaiter; window.__tsWaiter = null; if (w) w(window.__tsResult);
  };
  var s0 = document.createElement('script');
  s0.src = EXEC + '?action=data&name=tile_settings.json&callback=__ttTileSettingsPre&cb=' + Date.now();
  s0.onerror = function () { window.__ttTileSettingsPre({}); };
  sendLater_(s0);

  // ★★2026-07-17：全ボタン共通「押してから表示までを速くする」仕組み（1本化）。
  //   新しいボタンを足す時は、下の VIEWS 表に1行足すだけで、①このページ自身の先読み
  //   ②ホーム画面滞在中の裏取り、の両方に自動で乗る（個別にコードを書き足す必要がない）。

    // ★2026-09-16：見切りを10秒→4秒に（ふつうの返事は2.5〜3.6秒。止まった時に長く待たせない）。

        if (got || gaveUp) return;

          onPayload(lastErr && lastErr.error ? lastErr : { error: '通信エラーです。通信環境をご確認くださいませ🙇' });

      entry.cached = null;

      if (!payload || payload.error) return;

      var pe = entry.payload; entry.payload = undefined; entry.done = true;
      if (pe && !pe.error) { renderIfDifferent(pe); return; }

  // ===== スレッズコをホーム画面に入れる（2026-11-10 まるちゃん）=====
  //   ズコの中のスレッズコ（スマホ）に「ホーム画面に追加」を出す → 自分専用のリンク（上の zkCarryIn_ が受け取る形）を
  //   ブラウザで開く → ブラウザ側には「共有 → ホーム画面に追加」の案内を出す。独立した画面（solo=1）にはボタンを出さない。
  function zkCarryUrl_(o) {
    if (!(o.dv && o.dk && o.device)) return '';
    var u = o.origin + o.path + '?' + (o.staff ? 'staff=1&' : (o.dev ? 'dev=1&' : '')) + 'view=threads&solo=1&zin=1' +
      '&zdv=' + o.dv + '&zdk=' + o.dk + '&zsd=' + encodeURIComponent(o.device);
    if (o.staff && o.who) u += '&zwho=' + encodeURIComponent(o.who) + '&zat=' + encodeURIComponent(o.at || '0');
    return u;
  }
  // ホーム画面への追加が済んだスタッフ（2026-11-10 オリーブ 18:15・みかん 19:30 にボタンから追加済み＝開いた記録で確認）
  var ZK_CARRY_DONE_WHO_ = ['olive', 'mikan'];
  function zkCarryUi_() {
    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/.test(ua), android = /Android/.test(ua);
    if (!(ios || android)) return;
    var headEl = document.querySelector('.thw .hhead');
    if (!headEl) return;
    var solo = params.get('solo') === '1';
    var app = false;
    try { app = (navigator.standalone === true) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); } catch (e) {}
    var browser = ios ? 'Safari' : 'Chrome';
    // iPhoneの共有ボタンの絵（□に↑）。言葉だけだと分からないので、同じ絵を文の中に出す。
    var shareIco = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-5px"><path d="M12 15V3M8 7l4-4 4 4M7 11H5v10h14V11h-2"/></svg>';
    // ブラウザが開いたあとに押す所（番号付き・1行に1つ）
    var steps = ios
      ? ['共有ボタン（' + shareIco + '）を押してください😊', '「ホーム画面に追加」を押してください😊']
      : ['右上の「⋮」を押してください😊', '「アプリをインストール」を押してください😊'];
    var note = ios ? '共有ボタンが見つからない時は、「…」を押すと出てきます。' : '「アプリをインストール」が無い時は、「ホーム画面に追加」を押してください😊';
    var NUM = ['①', '②', '③'];
    function stepsHtml(list, size) {
      var h = '';
      for (var i = 0; i < list.length; i++) {
        h += '<div style="display:flex;gap:8px;text-align:left;font-size:' + size + ';line-height:1.6;margin:6px 0;"><span style="flex:0 0 auto;">' + NUM[i] + '</span><span>' + list[i] + '</span></div>';
      }
      return h;
    }

    // ①ブラウザで自分専用のリンクを開いた所＝次に押す所の案内（アイコンから開いた時は出さない）
    if (solo) {
      if (params.get('zin') !== '1' || app) return;
      var bar = document.createElement('div');
      bar.id = 'zkCarryBar';
      bar.style.cssText = 'background:#fff;color:#12303c;font-weight:800;padding:12px 14px;border-radius:12px;margin:0 0 10px;box-shadow:0 4px 10px rgba(0,0,0,.18);';
      bar.innerHTML = '<div style="font-size:16px;line-height:1.6;text-align:center;margin-bottom:4px;">スレッズコをホーム画面に追加します😊</div>' +
        stepsHtml(steps, '15px') +
        '<div style="font-size:12px;font-weight:600;line-height:1.6;color:#4b6470;margin-top:4px;">' + note + '</div>';
      headEl.parentNode.insertBefore(bar, headEl);
      return;
    }

    // ②ズコの中のスレッズコ＝「← 戻る」の右に、同じ大きさの「📲 ホーム画面に追加」ボタン
    //   ★2026-11-10 まるちゃん「スタッフにわかるようしろ」＝初めは題名の横の小さい字で、気づけなかった。
    //   ★2026-11-11 まるちゃん「その二人にはホーム追加はもう消してよくない？」＝追加が済んだスタッフには出さない。
    //     iPhoneはズコとアイコンの記憶が別なので、済んだかを画面から知る道が無い＝名前で外す。
    //     スマホを替えた等でもう一度要る時は、ZK_CARRY_DONE_WHO_ から外す。
    if (staff && ZK_CARRY_DONE_WHO_.indexOf(who) >= 0) return;
    var url = zkCarryUrl_({ origin: location.origin, path: location.pathname, staff: staff, dev: dev,
      dv: lsGet('zk_dv'), dk: lsGet('zk_dk'), device: device, who: who, at: lsGet('sz_picked_at') });
    if (!url || typeof szPopup_ !== 'function') return;
    function copyLink() {
      function done() {
        szPopup_('リンクをコピーしました。' + browser + 'のアドレスの欄に貼り付けて開いてください😊\nこのリンクは、ほかの人に送らないでください🙇', { icon: '📋' });
      }
      function fail() {
        var m = szPopup_('<div style="font-size:1.1rem;line-height:1.7;margin-bottom:10px">下のリンクをコピーして、' + browser + 'のアドレスの欄に貼り付けてください🙇</div>' +
          '<textarea readonly style="width:100%;height:120px;font-size:13px;box-sizing:border-box;border-radius:8px;padding:8px;"></textarea>', { icon: '📋', isHtml: true });
        try { var t = m.querySelector('textarea'); t.value = url; t.focus(); t.select(); } catch (e) {}
      }
      try { navigator.clipboard.writeText(url).then(done, fail); } catch (e) { fail(); }
    }
    function openBrowser() {
      if (!app) { location.href = url; return; }   // もうブラウザで開いている＝そのまま進む
      var left = false;
      function onVis() { if (document.hidden) left = true; }
      document.addEventListener('visibilitychange', onVis);
      try {
        location.href = ios ? ('x-safari-' + url)
          : ('intent://' + url.replace(/^https:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end');
      } catch (e) {}
      setTimeout(function () {
        document.removeEventListener('visibilitychange', onVis);
        if (left) return;   // ブラウザへ切り替わった＝開けた
        szPopup_(browser + 'が開かない時は、リンクをコピーして、' + browser + 'のアドレスの欄に貼り付けてください🙇',
          { icon: '📲', cancel: true, noLabel: '閉じる', yesLabel: 'リンクをコピー', onYes: copyLink });
      }, 2500);
    }
    var b = document.createElement('button');
    b.type = 'button';
    b.id = 'zkCarryBtn';
    b.className = 'uhome';
    b.textContent = '📲 ホーム画面に追加';
    b.style.cssText = 'margin-left:auto;font-family:inherit;cursor:pointer;';
    b.addEventListener('click', function () {
      szPopup_('<div style="font-size:1.25rem;line-height:1.6;margin-bottom:10px;">スレッズコのアイコンを、このスマホのホーム画面に追加します😊</div>' +
        stepsHtml(['下の「' + browser + 'で開く」を押してください😊'].concat(steps), '1.1rem') +
        '<div style="font-size:.85rem;font-weight:600;line-height:1.6;text-align:left;color:#b9d0da;margin-top:6px;">' + note + '</div>',
        { icon: '📲', isHtml: true, cancel: true, yesLabel: browser + 'で開く', onYes: openBrowser });
    });
    var ubar = document.querySelector('.home .ubar');
    if (ubar) { ubar.appendChild(b); }
    else { b.style.cssText += 'display:block;margin:0 0 8px auto;'; headEl.parentNode.insertBefore(b, headEl); }
  }

  // ★2026-11-13 まるちゃん「トマトは元祖がいちばんうえのはず。スタッフのスマホのならびにしてよ」：

  //   読めるまでは全員共通の並びで出し、読めたら描き直す（読めない時はそのまま）。
  var homeAsOrders_ = null;
  function showHome(perms, order) {
    var asM = window.__SZ_AS_ ? [null, window.__SZ_AS_] : null;
    var cfg = { perms: perms || (typeof defaultPerms_==='function' ? defaultPerms_() : null), order: order };
    if (asM && homeAsOrders_) { var po = homeAsOrders_[asM[1]]; if (po && po.order && po.order.length) cfg.asOrder = po.order; }
    mount(renderHomePage_(cfg, base, staff, dev, who));
    if (asM && !homeAsOrders_) {
      var cbn = '__ttHomeOrders' + Date.now();
      window[cbn] = function (d) {
        try { delete window[cbn]; } catch (e) {}
        homeAsOrders_ = (d && d.people) || {};
        var po = homeAsOrders_[asM[1]];
        if (po && po.order && po.order.length) showHome(perms, order);
      };
      var so = document.createElement('script');
      so.src = EXEC + '?action=data&name=home_orders.json&callback=' + cbn + '&cb=' + Date.now();
      so.onerror = function () {};
      document.head.appendChild(so);
    }
    if (!asM && window.__orderSend) setTimeout(window.__orderSend, 5000);   // 画面の読み込みと取り合わないよう少し後で
  }

  // ===== 名前選択画面（スタッフURLで未選択のときだけ）=====
  // ★一度誰かが選んだ名前は他端末からは選べない（2026-07-16・重複選択防止）。ここでの除外は
  //   見た目の親切だけ＝本当の防止はconfirmPickのaction=claim(サーバー側の早い者勝ちロック)。
  function showPicker(people, labels, claimed) {
    var root = document.getElementById('root');
    try { window.__btDone && window.__btDone('名前選択'); } catch (e) {}
    var pick = (people || []).filter(function (p) { return p !== 'kanbu' && !(claimed && claimed[p]); });
    var btns = pick.map(function (pid) {
      return '<button type="button" class="pk" data-who="' + esc(pid) + '">' + esc(labels[pid] || pid) + '</button>';
    }).join('');
    root.innerHTML = '<div class="pkwrap"><div class="pktitle">あなたは誰ですか？</div>' +
      '<div class="pkgrid">' + btns + '</div>' +
      '<div class="pknote">すでに他の人が選んだ名前は出ません。自分の名前が無い時は、自動監視システムから新しく作ってもらってください😊</div></div>';
    var bs = root.querySelectorAll('.pk');
    for (var i = 0; i < bs.length; i++) {
      bs[i].addEventListener('click', function () {
        confirmPick(this.getAttribute('data-who'), this.textContent);
      });
    }
  }
  function confirmPick(pid, label) {
    var root = document.getElementById('root');
    root.innerHTML = '<div class="pkwrap"><div class="pktitle">あなたは「' + esc(label) + '」で<br>正しいですか？</div>' +
      '<div class="pkbtns"><button type="button" class="pkno">ちがう</button>' +
      '<button type="button" class="pkyes">はい</button></div></div>';
    root.querySelector('.pkyes').addEventListener('click', function () {
      var yesBtn = this; yesBtn.disabled = true;
      // 早い者勝ちの確保をGASへ依頼。通ってから初めて端末に記憶する（他端末と同時に選んだ時の安全弁）。
      window.__ttClaim = function (r) {
        if (r && r.ok) {
          lsSet(LS_WHO, pid); lsSet(LS_ROLE, 'スタッフ'); lsSet(LS_LABEL, label);
          lsSet('sz_picked_at', String(Date.now()));   // リセット合図との比較用（選んだ時刻）
          location.reload();   // 記憶して読み直し→通常フローへ
        } else {
          root.innerHTML = '<div class="pkwrap"><div class="pktitle">' +
            esc((r && r.error) || 'すでに他の人が選択しています') + '</div>' +
            '<div class="pknote">再読込してから、もう一度選択してください😊</div></div>';
          setTimeout(function () { location.reload(); }, 1800);
        }
      };
      var s = document.createElement('script');
      s.src = EXEC + '?action=claim&pid=' + encodeURIComponent(pid) + '&device=' + encodeURIComponent(device) +
        '&label=' + encodeURIComponent(label) + '&callback=__ttClaim&cb=' + Date.now();
      s.onerror = function () {
        root.innerHTML = '<div class="pkwrap"><div class="pktitle">通信エラーです</div>' +
          '<div class="pknote">再読込してから、もう一度選択してください😊</div></div>';
        setTimeout(function () { location.reload(); }, 1800);
      };
      document.body.appendChild(s);
    });
    root.querySelector('.pkno').addEventListener('click', function () { location.reload(); });
  }

  // ===== 合言葉（スタッフURLのみ・名前選択より前に出す）=====
  // ★あくまで「知らない人が適当に開けない」程度の鍵。正解の合言葉自体はここには置かず、
  //   GAS(action=checkpw)へ問い合わせてok:true/falseだけ受け取る。合言葉は自動監視メニュー4
  //   （tile_settings.py）から事務所PCが変更できる。一度通れば端末に記憶し、次回以降は聞かない
  //   （名前選択のリセット合図とは別物＝パスワードを変えても既存端末の記憶は自動では消えない）。
  function showPwGate(cfg) {
    var root = document.getElementById('root');
    try { window.__btDone && window.__btDone('合言葉'); } catch (e) {}
    root.innerHTML = '<div class="pkwrap"><div class="pktitle">パスワードを<br>入力してください😊</div>' +
      '<input type="text" id="pwIn" class="pwinput2" autocomplete="off" autocapitalize="off">' +
      '<button type="button" class="pwgo" id="pwGoBtn">すすむ</button>' +
      '<div class="pwerr" id="pwErr"></div></div>';
    var input = root.querySelector('#pwIn');
    var btn = root.querySelector('#pwGoBtn');
    var err = root.querySelector('#pwErr');
    function submit() {
      var v = input.value;
      if (!v) return;
      btn.disabled = true; err.textContent = '';
      window.__ttCheckPw = function (r) {
        btn.disabled = false;
        if (r && r.ok) {
          // ★2026-10-18：合言葉から印を作ってこの端末に覚え、読み直す（以後の問い合わせ全部に印が付く）。
          window.__zkMakeTk(v).then(function (tk) {
            lsSet('zk_tk', tk); lsSet(LS_PWOK, '1');
            try { sessionStorage.removeItem('zk_fail_once'); } catch (e) {}
            location.reload();
          })['catch'](function () { err.textContent = 'この端末ではパスワードを確認できませんでした。'; });
        }
        else { err.textContent = (r && r.error) || 'パスワードが違います。もう一度試してもらえると嬉しいです🙇'; input.value=''; input.focus(); }
      };
      var s = document.createElement('script');
      s.src = EXEC + '?action=checkpw&pw=' + encodeURIComponent(v) + '&callback=__ttCheckPw&cb=' + Date.now();
      s.onerror = function () { btn.disabled = false; err.textContent = '通信エラーです。もう一度試してもらえると嬉しいです🙇'; };
      document.body.appendChild(s);
    }
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    input.focus();
  }

  // ★★2026-07-17：ホーム画面に居る間、**その人に見えるボタンだけ**を裏で先取りしておく
  //   （見えないボタン＝権限が無い物は無駄になるだけなので取りに行かない）。ホームの表示自体は
  //   showHome()が既に終わった後にこれを呼ぶので、1ミリ秒も遅くならない。
  //   結果は sessionStorage["sz_prefetch_<ボタン名>"] に保存し、そのボタンを押して画面が
  //   切り替わった時（＝新しいページの早期スクリプト）がこれを消費して即描画する。
  function prefetchForHome_(allow) {
    var VIEWS = window.__SZ_VIEWS_ || {};
    // ★同じファイルを見る画面が複数ある時は、取りに行くのは1回だけ。
    //   ただし**取れた中身は、そのファイルを見る画面すべてに配る**（2026-09-11）。
    //   ＝前は2つ目の画面を素通りしていたので、その画面だけ待ち0秒にならなかった。
    var byAction = {};
    for (var v in VIEWS) {
      if (allow && allow[v] !== true) continue;   // devは allow===null＝全部先取りしてよい
      (byAction[VIEWS[v]] = byAction[VIEWS[v]] || []).push(v);
    }
    for (var action in byAction) {
      (function (views, action) {
        var cb = '__ttHomePre_' + views[0];
        window[cb] = function (payload) {
          if (payload && !payload.error) {
            for (var i = 0; i < views.length; i++) {
              try {
                sessionStorage.setItem('sz_prefetch_' + views[i],
                                       JSON.stringify({ at: Date.now(), payload: payload }));
              } catch (e) {}
            }
            // ★2026-11-13 まるちゃん「かぶりが出てる時には、スタッフ画面の右側に 被り検出あり っていう注意ボタンを出して」
            //   ＝取れた予定で、被り検出の画面と同じ判定（detect_core.js）で数え、1件以上ならホームの「⚠️ 被り検出あり」を出す。
            //   ★同日「記入漏れあり も出す」＝記入漏れの画面と同じく、要対応の一覧（action）が1件以上なら出す。
            var kgo = null, kn = 0;
            try {
              if (views.indexOf('conflict') >= 0) {
                kgo = 'conflict';
                kn = detect(payload.events, false, payload.date_from).conflicts.length +
                     detectStaff(payload.events, payload.date_from).conflicts.length;
              } else if (views.indexOf('lt') >= 0) {
                kgo = 'lt'; kn = (payload.action || []).length;
              }
              if (kgo) {
                var kb = document.querySelectorAll('.hkaburi[data-go="' + kgo + '"]');
                for (var ki = 0; ki < kb.length; ki++) kb[ki].style.display = kn > 0 ? '' : 'none';
              }
            } catch (e) {}
          }
        };
        var s = document.createElement('script');
        s.src = EXEC + '?action=data&name=' + action + '&callback=' + cb + '&cb=' + Date.now();
        s.onerror = function () {};
        document.head.appendChild(s);
      })(byAction[action], action);
    }
    // ★2026-11-13 まるちゃん「施術後LINE未送信あり」：施術が終わって2時間たっても施術後のLINEを送っていない方がいる時だけ、
    //   ホームの「⚠️ 施術後LINE未送信あり」を出す。一覧は事務所の見回りが5分ごとに作る（送り忘れの知らせと同じ判断）。
    //   施術後のLINE送信を開ける人だけ。
    if (!allow || allow.sgline === true) {
      var acb = '__ttHomeAc_' + Date.now();
      window[acb] = function (p) {
        try {
          var on = !!(p && !p.error && p.overdue && p.overdue.length);
          var bs = document.querySelectorAll('.hkaburi[data-go="sgline"]');
          for (var bi = 0; bi < bs.length; bi++) bs[bi].style.display = on ? '' : 'none';
        } catch (e) {}
      };
      var acs = document.createElement('script');
      acs.src = EXEC + '?action=data&name=aftercare_yesterday.json&callback=' + acb + '&cb=' + Date.now();
      acs.onerror = function () {};
      document.head.appendChild(acs);
    }
  }

  // ===== 起動：タイル設定/権限を取得 → 名前選択 or 画面表示 =====
  function boot(cfg) {
    var people = (cfg && cfg.people) || ['kanbu','ringo','mikan','olive','marron','mango','coconut','reception'];
    // ★2026-11-10 名前を選ぶ画面に「pine」など英語の番号のまま出ていた（置き場の tile_settings.json には表示名が無い）
    //   ＝code.js の表示名（🍍パイン 等・新しく足した人も）を混ぜる。読めない時は今までどおり。
    var labels = (cfg && cfg.labels) || {};
    try { if (typeof _labelsFromCfg_ === 'function') { var lb2 = _labelsFromCfg_(cfg || {}) || {}; for (var lk in labels) lb2[lk] = labels[lk]; labels = lb2; } } catch (e) {}
    // ★2026-09-17 まるちゃん指摘「トマトさんの画面にプロセルボタンが出ていない」：
    //   ここに届くのは保存したそのまま（人ごとの表示で触れるボタンだけ）なので、保存に書いていない
    //   新しいボタン（プロセル頭キャリスト・施術後の予約）は社長版で「見せない」扱いになっていた。
    //   グーグル側で開いた時と同じく、初めの決まり（code.js の defaultPerms_）を混ぜてから使う。
    //   スタッフに割り当てるボタンは保存に全部書いてあるので、スタッフの見え方は変わらない（確認済み）。
    var perms  = (cfg && cfg.perms)
      ? ((typeof _permsFromCfg_ === 'function') ? _permsFromCfg_(cfg) : cfg.perms) : null;
    var order  = (cfg && cfg.order) || null;   // ボタンの並び順（自動監視メニュー4で変更可）

    // 端末リセットの合図：この端末が名前を選んだ時刻より後にリセット指示があれば、記憶を消して選び直し。
    // （PCの自動監視メニュー4で「この人を選び直し／全員を選び直し」を押すと合図が立つ。次回起動で効く）
    if (staff && who && !window.__SZ_AS_) {   // ★見本（&as=）ではこの端末の記憶を消さない
      var resets = (cfg && cfg.resets) || {};
      var pickedAt = parseInt(lsGet('sz_picked_at') || '0', 10) || 0;
      var need = Math.max(parseInt(resets.all || 0, 10) || 0, parseInt(resets[who] || 0, 10) || 0);
      if (need > pickedAt) {
        lsDel(LS_WHO); lsDel(LS_ROLE); lsDel(LS_LABEL); lsDel('sz_picked_at');
        who = ''; window.__SZ_WHO_ = '';
      }
    }
    // スタッフURLで名前が未選択なら、まず名前を選ばせる（選ぶまで他は出さない）。
    if (staff && !who) { showPicker(people, labels, (cfg && cfg.claimed) || {}); return; }

    // 権限判定は code.js の関数を再利用＝GAS(①)と完全一致。
    var allow = (typeof personPerms_ === 'function')
      ? personPerms_(perms || (typeof defaultPerms_==='function'?defaultPerms_():{}), staff, dev, who) : null;
    window.__SZ_ALLOW_ = allow;   // ★予約入力の中のボタンの出し分けにも使う（null＝開発者＝全部）
    var v = view;
    if (typeof viewAllowed_ === 'function' && !viewAllowed_(v, allow)) v = 'home';

    logHit(v);
    if (v === 'lt') showLt();
    else if (v === 'uriage') showUriage();
    else if (v === 'unanswered') showUnanswered();
    else if (v === 'akijikan') showAkijikan();
    else if (v === 'links') showLinks();
    else if (v === 'ttapp') showTeikei();
    else if (v === 'procell') showProcell();
    else if (v === 'kanshi') showKanshi();
    else if (v === 'zenjitsu') showZenjitsu();
    else if (v === 'cost') showCost();
    else if (v === 'koukoku') showKoukoku();
    else if (v === 'pcstatus') showPcStatus();
    else if (v === 'shophist') showShopHist();
    else if (v === 'procamp') showProcamp();
    else if (v === 'procstock') showProcStock();
    else if (v === 'uriagebook') showUriageBook();
    else if (v === 'shomeisho') showShomeisho();
    else if (v === 'hanbai') showHanbai();
    else if (v === 'threads') showThreads();
    else if (v === 'insta') showInsta();
    else if (v === 'facebook') showFacebook();
    else if (v === 'mita') showMita();
    else if (v === 'foldertest') showFolderTest();
    else if (v === 'hachimitsu') showHoney();
    else if (v === 'claudetools') showClaudeTools();
    else if (v === 'timedsend') showTimedSend();
    else if (v === 'bcast') showBroadcast();
    else if (v === 'timetree') showTimeTree();
    else if (v === 'yoyaku') showYoyaku();
    else if (v === 'yoyaku_sejutsugo') showYoyakuSejutsugo();
    else if (v === 'yoyaku_new') showYoyakuNew();
    else if (v === 'yoyaku_kizon') showYoyakuKizon();
    else if (v === 'yoyaku_henkou') showYoyakuHenkou();
    else if (v === 'rireki') showRireki();
    else if (v === 'conflict') showConflict();
    else { showHome(perms, order); prefetchForHome_(allow); }
  }

  // ★events(被りデータ)/tilesettings(権限) はページ冒頭の早期スクリプトで既に発射済み
  //   （重い code.js の読み込みを待たずに約0.6秒早くスタート）。ここでは先読み結果を消費するだけ：
  //   tilesettings が届いていれば即 boot、まだなら届き次第 boot する。events は showConflict が
  //   __prefetchedEvents を使い切りで拾う（初回のみ／部屋移動後などのリフレッシュは新規取得で新鮮）。
  function bootOrGate(cfg) {
    // ★2026-10-18 午後：合言葉はやめた。まだ許可していないスマホは、どの入口でも「許可待ち」の画面だけ出す。
    if (window.__zkBlocked && window.__zkBlocked()) { window.__zkShowWait(); return; }
    boot(cfg);
  }

  // ★★初期表示の最速化（2026-07-17・ユーザー要望「ホーム画面から開いてトップが出るまでを極限まで短く」）
  //   実測：GAS(EXEC)への1往復は**中身に関係なく2.0〜2.5秒**（一番軽い返事でも同じ＝Googleの
  //   往復そのものが遅い。ファイルを読む時間は0.2秒ほどしかない＝GAS側をいくら速くしても縮まない）。
  //   なのに今までは、その返事（誰にどのボタンを見せるか）を**待ってから**ボタンを描いていた。
  //   → **前回の答えをこの端末に覚えておき、待たずに即描く**。新しい答えは裏で届き、
  //     中身が変わっていた時だけ描き直す（ふだんは変わらないので描き直しも起きない）。
  //   ★安全側の注意：覚えている答えが古いと、権限を切ったばかりのボタンが数秒だけ見えうる。
  //     届いた時点で必ず描き直す＝見えるのは最大2〜3秒。名前選択(claimed)・選び直し(resets)も
  //     同じく届いた時点で正しく効く（下の useCfg_ が新しい答えで boot をやり直すため）。
  var LS_CFG = 'sz_cfg';
  var bootedFrom_ = null;
  function useCfg_(cfg, fromCache) {
    var str = JSON.stringify(cfg || {});
    if (bootedFrom_ === str) return;          // 前回と同じ中身＝描き直さない（ふだんはこれ）
    // 通信に失敗した時の空っぽの答えで、せっかく描いた画面を壊さない
    if (!fromCache && (!cfg || !cfg.people) && bootedFrom_ !== null) return;
    bootedFrom_ = str;
    try { if (window.__BT && !window.__BT.cf) window.__BT.cf = fromCache ? '覚えていた' : '待った'; } catch (e) {}
    if (!fromCache && cfg && cfg.people) lsSet(LS_CFG, str);
    bootOrGate(cfg || {});
  }
  var cachedCfg_ = lsGet(LS_CFG);
  if (cachedCfg_) { try { useCfg_(JSON.parse(cachedCfg_), true); } catch (e) {} }
  if (window.__tsResult !== undefined) { useCfg_(window.__tsResult, false); }
  else { window.__tsWaiter = function (cfg) { useCfg_(cfg || {}, false); }; }

  // ★2026-08-12：以前ここに「8秒たってもローディングのままなら、ホーム(?view無し)へ入り直す」保険が
  //   あったが、各種LINK等(?view付き)の読み込みが少し長引いた時に誤発動して目的の画面を奪い、
  //   ホーム(TOMATOさん版など)を開いてしまう害があった。元の詰まり原因(各種LINKが画像を待って固まる)は
  //   既に直した(URLは即表示・画像は押した時に取得)ので、この保険は撤去した。
})();
</script>
<script>
// ★★2026-09-16 まるちゃん決定：戻るボタンは全部「← 戻る」にそろえ、押したら本当に1つ前の画面に戻る。
//   ①画面の上の戻る（別の画面へ移る住所付きの物）＝アプリの中から来ていれば、来た画面へ戻る（履歴を1つ戻す）。
//     アプリの外から直接開いた時（履歴が無い時）だけ、住所どおりホームへ行く。
//   ②同じ画面の中に、もっと手前へ戻る戻るボタン（一覧→中身 等）が出ている時は、上の戻るは隠して1つだけにする。
//     押す場所が2つあると、片方だけ一気にホームまで戻ってしまうため。
(function () {
  var LABEL = '← 戻る';
  function isBack(el) { return el && (el.textContent || '').trim() === LABEL; }
  function isTopLink(el) {
    return el.tagName === 'A' && /[?&]view=/.test(el.getAttribute('href') || '');
  }
  function shown(el) { return el.offsetParent !== null || getComputedStyle(el).position === 'fixed'; }
  function cameFromApp() {
    var dir = location.origin + location.pathname.replace(/[^/]*$/, '');
    return (document.referrer || '').indexOf(dir) === 0 && history.length > 1;
  }
  // ★2026-09-17 まるちゃん「パソコン版で戻るを押すと、1つ前に戻らず、一回何か出て別の所へ移動する」。
  //   パソコン版スーパーズコのホームの窓の中では、ズコのトップへ移動せず（トップの待ち画面が一瞬出ていた）、
  //   ホームの窓に直接「押す前の部屋へ戻して」と頼む。窓にその口が無い所（スマホ・別の窓）は今までどおり。
  function toTop(a) {
    var m = /[?&]view=([^&#]*)/.exec(a.getAttribute('href') || '');
    return !m || m[1] === 'home';
  }
  function pcHome() {
    return window.pywebview && window.pywebview.api && typeof window.pywebview.api.back_home === 'function';
  }
  // ★2026-09-17：画面が自分で戻るを受け取る時（LINE一斉配信のように画面の中で1つずつ戻す）はそちらを優先する。
  //   前は先回りして受け取っていたので、途中の画面から押すとホーム（パソコンは押す前の部屋）まで戻ってしまった。
  //   → 画面の処理のあとに見て、画面が自分で止めていたら何もしない。
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented) return;
    var a = e.target && e.target.closest ? e.target.closest('a') : null;
    if (!a || !isBack(a) || !isTopLink(a)) return;
    if (toTop(a) && pcHome()) { e.preventDefault(); window.pywebview.api.back_home(); return; }
    if (cameFromApp()) { e.preventDefault(); history.back(); }
  }, false);

  var queued = false;
  function sync() {
    queued = false;
    var all = [].slice.call(document.querySelectorAll('a,button')).filter(isBack);
    var tops = all.filter(isTopLink);
    var inner = all.filter(function (el) { return tops.indexOf(el) < 0 && shown(el); });
    tops.forEach(function (t) {
      if (inner.length) { if (t.style.display !== 'none') { t.setAttribute('data-szhid', '1'); t.style.display = 'none'; } }
      else if (t.getAttribute('data-szhid')) { t.removeAttribute('data-szhid'); t.style.display = ''; }
    });
  }
  new MutationObserver(function () { if (!queued) { queued = true; setTimeout(sync, 0); } })
    .observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'hidden', 'class'] });
})();
</script>
<script>
/* ★2026-10-29 まるちゃん「ズコアプリのすべてに適用して」（販売管理のカレンダー直しを全画面へ）。
   iPhoneのカレンダーの左下「リセット」は中身を空にするだけで、画面によっては「日付を選んで」と止まる。
   どの画面のカレンダーでも、空にされたら最初に入っていた日付へ戻す（自分で戻し方を決めている画面＝data-own-reset は除く）。 */
(function(){
  function first(e){var t=e.target;if(!t||t.type!=="date"||t.hasAttribute("data-own-reset"))return;
    if(!t.hasAttribute("data-first")&&t.value)t.setAttribute("data-first",t.value);}
  function back(e){var t=e.target;if(!t||t.type!=="date"||t.hasAttribute("data-own-reset"))return;
    if(!t.value&&t.getAttribute("data-first")){t.value=t.getAttribute("data-first");}}
  ["focusin","pointerdown","touchstart"].forEach(function(ev){document.addEventListener(ev,first,true);});
  ["input","change","blur"].forEach(function(ev){document.addEventListener(ev,back,true);});
})();
</script>
