<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTスーパーズコApp</title>
<style>
  html, body { margin:0; background:#2C7A99; }
  #root { min-height:100vh; }
  .boot { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    color:#fff; opacity:.85; font-family:"Segoe UI","Hiragino Sans",system-ui,sans-serif; }
  .bootIcon { width:min(60vw,260px); height:min(60vw,260px); border-radius:20%; box-shadow:0 6px 20px rgba(0,0,0,.3); }
  .bootText { font-size:26px; font-weight:800; }
  .bootTextLg { font-size:min(11vw,50px); font-weight:800; text-align:center; line-height:1.35; padding:0 20px; }
  /* 名前選択（スタッフURLで初回のみ） */
  .pkwrap{ max-width:520px; margin:0 auto; padding:34px 18px; color:#fff;
    font-family:"Segoe UI","Hiragino Sans",system-ui,sans-serif; text-align:center; }
  .pktitle{ font-size:30px; font-weight:800; margin-bottom:22px; line-height:1.5; }
  .pkgrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .pk{ background:#fff; color:#155e75; border:0; border-radius:14px; padding:22px 10px;
    font-size:24px; font-weight:800; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .pk:active{ transform:scale(.97); }
  .pkbtns{ display:flex; gap:12px; justify-content:center; margin-top:6px; }
  .pkyes,.pkno{ border:0; border-radius:12px; padding:20px 36px; font-size:24px; font-weight:800; cursor:pointer; }
  .pkyes{ background:#16a34a; color:#fff; } .pkno{ background:#e5e7eb; color:#333; }
  .pknote{ margin-top:20px; font-size:12.5px; opacity:.82; line-height:1.7; }
  /* 合言葉（スタッフURLで初回のみ・名前選択より前に出す） */
  .pwinput2{ font-size:26px; text-align:center; padding:16px 14px; border-radius:14px; border:0;
    width:100%; max-width:280px; box-sizing:border-box; margin:0 auto 16px; display:block; }
  .pwgo{ background:#16a34a; color:#fff; border:0; border-radius:12px; padding:18px 40px;
    font-size:22px; font-weight:800; cursor:pointer; }
  .pwgo:active{ transform:scale(.97); }
  .pwgo:disabled{ opacity:.6; }
  .pwerr{ margin-top:16px; font-size:15px; color:#ffd7d7; min-height:1.4em; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  // 起ち上げ直後（ホーム画面のアイコンから開いた時＝view指定なし）は、
  // スマホ自身が先に出すアイコン画面(OS側・制御不可)のすぐ後に、アイコンを重ねて出さず
  // 「TTスーパーズコを起動中」の文字だけを最初から表示する（アイコンが二重に見える対策）。
  // ボタンを押した後の画面遷移（?view=... 付き）は元通り「よみこみ中…」の文字付きを最初から表示。
  var view = (new URLSearchParams(location.search)).get('view') || 'home';
  var root = document.getElementById('root');
  if (view === 'home') {
    root.innerHTML = '<div class="boot"><div class="bootTextLg">TTスーパーズコ<br>を起動中</div></div>';
  } else {
    root.innerHTML = '<div class="boot"><div class="bootText">ズコがお散歩中...</div><img src="icons/icon-512.png" alt="" class="bootIcon"></div>';
  }
})();
</script>

<!-- 判定コア(detect)と、GASと共通の描画関数(renderHome_/renderPage_/personPerms_ など)。
     どちらも純JS。GAS専用の関数(doGet等)は同梱されるが呼ばれないだけ。
     ★?v=... はキャッシュ避け（GitHub PagesがCache-Control: max-age=600を付けるため、
     コード更新のたびにここの番号を上げないとスマホが古いJSを最大10分キャッシュし続ける）。
     更新手順：code.js/detect_core.jsを直したら、この2行の?v=も必ず同じ値へ上げてからpushする。 -->
<!-- ★被り画面の初期表示を最速化：events(被りデータ)と tilesettings(権限)の取得を、重い
     detect_core.js/code.js の読み込みより「前」に発射する（約0.6秒早くスタート）。結果はグローバルに
     貯め、下の本体スクリプトが code 読み込み後に拾って描画/起動する（発射だけなので code 不要）。 -->
<script>
(function () {
  var EXEC = "https://script.google.com/macros/s/AKfycbzSxho3e4CHyAuoymGlzcVwGnLshGoCg53zY18laLrHMq5Cun_pBv8XgRsNxKMDxlKwUA/exec";
  var view = (new URLSearchParams(location.search)).get('view') || 'home';

  // tilesettings（権限・名前選択に必要＝全画面で使う）
  window.__tsResult = undefined; window.__tsWaiter = null;
  window.__ttTileSettingsPre = function (payload) {
    window.__tsResult = payload || {};
    var w = window.__tsWaiter; window.__tsWaiter = null; if (w) w(window.__tsResult);
  };
  var s0 = document.createElement('script');
  s0.src = EXEC + '?action=data&name=tile_settings.json&callback=__ttTileSettingsPre&cb=' + Date.now();
  s0.onerror = function () { window.__ttTileSettingsPre({}); };
  document.head.appendChild(s0);

  // ★★2026-07-17：全ボタン共通「押してから表示までを速くする」仕組み（1本化）。
  //   新しいボタンを足す時は、下の VIEWS 表に1行足すだけで、①このページ自身の先読み
  //   ②ホーム画面滞在中の裏取り、の両方に自動で乗る（個別にコードを書き足す必要がない）。
  //   ★実測：どのデータも取得はGoogleの処理時間だけで常に2〜2.9秒かかる（中身を軽くしても
  //   縮まらない）。だから「押してから取りに行く」のをやめ、前の画面（主にホーム）に
  //   居る間に裏で済ませておく方式に統一した（被り検出で先に実装・検証済みの型を横展開）。
  var VIEWS = window.__SZ_VIEWS_ = {
    conflict:   'events.json',
    lt:         'lt_match.json',
    uriage:     'uriage.json',
    unanswered: 'unanswered.json',
    akijikan:   'akijikan.json',
    links:      'links.json'
    // ★kanshi(自動監視)は対象外＝開発URL専用でスタッフの目には触れず、装置の見分け(device)も
    //   要るため。頻度も低く先取りの旨味が薄い（詳細は共通\スーパーズコApp_必読.md）。
  };
  window.__PF_ = window.__PF_ || {};

  var action = VIEWS[view];
  if (action) {
    var entry = window.__PF_[view] = { payload: undefined, waiter: null, cached: null, done: false };
    // ホーム画面滞在中に裏取りできていた分があれば使い切りで受け取る（無ければ null のまま）。
    try {
      var raw = sessionStorage.getItem('sz_prefetch_' + view);
      sessionStorage.removeItem('sz_prefetch_' + view);   // 使い切り＝次に来た時は必ずまた取り直す
      if (raw) {
        var c = JSON.parse(raw);
        if (c && c.payload) entry.cached = c.payload;
      }
    } catch (e) {}
    // このページ自身の新しい取得も同時に発射（従来の「先読み」と同じ・被り検出で検証済み）。
    var cb = '__ttPre_' + view;
    window[cb] = function (payload) {
      entry.payload = payload || null;
      var w = entry.waiter; entry.waiter = null; if (w) w(entry.payload);
    };
    var sp = document.createElement('script');
    sp.src = EXEC + '?action=data&name=' + action + '&callback=' + cb + '&cb=' + Date.now();
    sp.onerror = function () { window[cb]({ error: 'net' }); };
    document.head.appendChild(sp);
  }
})();
</script>
<script src="detect_core.js?v=20260731matsueku"></script>
<script src="code.js?v=20260805chg9"></script>
<script>
(function () {
  // 施術室被りデータは公開リポジトリに置かず、GASからJSONPで取得する
  // （このページはGASを表示しないので、Googleの「別ユーザー作成」警告バーは出ない）。
  var EXEC = "https://script.google.com/macros/s/AKfycbzSxho3e4CHyAuoymGlzcVwGnLshGoCg53zY18laLrHMq5Cun_pBv8XgRsNxKMDxlKwUA/exec";

  var params = new URLSearchParams(location.search);
  var view  = params.get('view') || 'home';
  var staff = params.get('staff') === '1';
  // 開発用URL（?dev=1）＝tile_settings.jsonの表示ON/OFF設定を無視して全ボタン表示。staff指定時は無効。
  var dev   = !staff && params.get('dev') === '1';
  var nail  = params.get('nail') === '1';
  var base  = location.pathname;   // メニュー内の遷移は同じページの ?view= を切り替えるだけ

  // ===== 操作者(who)＝この端末で選んだ名前。localStorageに「固定」する。=====
  // 一度選んだら本人は変更不可。変えられるのは開発者だけ＝開発URLに ?reset=1 を付けて解除する。
  var LS_WHO='sz_who', LS_ROLE='sz_role', LS_DEV='sz_device', LS_LABEL='sz_label', LS_PWOK='sz_pw_ok', LS_IDMPW='idm_pw';
  function lsGet(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
  // 開発者だけのロック解除（対象端末で開発URL＋?reset=1を開く）。
  if (dev && params.get('reset') === '1') { lsDel(LS_WHO); lsDel(LS_ROLE); lsDel(LS_LABEL); }
  // ★IGのDMの合言葉：URLに idmkey が付いていたら、この端末に覚えさせる（パソコン版・開発ズコの
  //   事前ログイン用。合言葉そのものは公開コードに書かず、開いたURLからだけ入る）。
  var _idmkey = params.get('idmkey');
  if (_idmkey) { lsSet(LS_IDMPW, _idmkey); }

  var device = lsGet(LS_DEV);
  if (!device) { device = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); lsSet(LS_DEV, device); }
  var who  = staff ? lsGet(LS_WHO) : '';
  var role = staff ? (lsGet(LS_ROLE) || 'スタッフ') : (dev ? '開発' : '社長(幹部)');
  // MOVESCRIPT_ の szIdent_（部屋移動の送信）が拾えるようグローバルへ。localStorageが主・これは補助。
  window.__SZ_WHO_ = who;
  window.__SZ_ROLE_ = role;
  window.__SZ_DEVICE_ = device;

  // ===== ホーム画面インストール可否（PWA化）。幹部用/スタッフ用/開発用の全URLで共通。=====
  // 自動の案内帯は出さない。Android=Chromeの「⋮」メニュー→「アプリをインストール」、
  // iPhone=共有ボタン→「ホーム画面に追加」、どちらも手動のみ。名前とアイコンは3つとも同じ。
  (function () {
    var manifestFile = staff ? 'manifest-staff.json' : (dev ? 'manifest-dev.json' : 'manifest-kanbu.json');
    var head = document.head;

    var manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = manifestFile;
    head.appendChild(manifestLink);

    if ('serviceWorker' in navigator) {
      // ★2026-07-18：スタッフが手で「完全に閉じて開き直す」「アイコンを削除して入れ直す」等を
      //   しなくても新しい版が届くようにする。ブラウザは既定だと保存係(sw.js)の中身を
      //   最大24時間チェックしないことがある＝普通に開き直すだけでは新しくならない場合がある。
      //   対策：①毎回開いた瞬間に明示的に更新確認(update())を強制②新しい保存係に交代した瞬間
      //   (controllerchange)に1回だけ自動で画面を作り直す(location.reload)。人の操作は不要。
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        try { reg.update(); } catch (e) {}
      }).catch(function () {});
      var szReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (szReloaded) return;
        szReloaded = true;
        location.reload();
      });
    }

    // Chrome自身が出す自動バナーも抑止（手動メニューからのインストールは引き続き可能）。
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); });

    // ===== iPhone(Safari)対応 =====
    // iOSはmanifest.jsonの内容を見ないので、Apple専用のmeta/linkで同じことを指定する。
    // インストールは常に手動(共有ボタン→「ホーム画面に追加」)のみ・自動バナーはiOSに存在しない。
    var appleCapable = document.createElement('meta');
    appleCapable.name = 'apple-mobile-web-app-capable';
    appleCapable.content = 'yes';
    head.appendChild(appleCapable);

    var appleTitle = document.createElement('meta');
    appleTitle.name = 'apple-mobile-web-app-title';
    appleTitle.content = 'TTズコ';
    head.appendChild(appleTitle);

    var appleStatusBar = document.createElement('meta');
    appleStatusBar.name = 'apple-mobile-web-app-status-bar-style';
    appleStatusBar.content = 'black-translucent';
    head.appendChild(appleStatusBar);

    var appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon';
    appleIcon.sizes = '180x180';
    appleIcon.href = 'icons/icon-180.png';
    head.appendChild(appleIcon);
  })();

  function esc(s){ return (typeof esc_==='function') ? esc_(s) : String(s==null?'':s); }

  function runScripts(container) {
    // innerHTMLで挿入した<script>は実行されないので、作り直して実行する
    // （renderPage_ 内の TTSCRIPT_/MOVESCRIPT_ などを効かせるため）。
    var list = container.querySelectorAll('script');
    for (var i = 0; i < list.length; i++) {
      var old = list[i];
      var s = document.createElement('script');
      if (old.src) s.src = old.src; else s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    }
  }

  function mount(html) {
    var root = document.getElementById('root');
    root.innerHTML = html;
    runScripts(root);
    window.scrollTo(0, 0);
  }

  function fail(msg) {
    document.getElementById('root').innerHTML =
      '<div class="boot" style="text-align:center;padding:1.5em;">' + msg + '</div>';
  }

  // ===== アクセスログ（画面表示ごとにGASへ。GASが一旦貯め、事務所PCがDBへ回収）=====
  var hitDone_ = false;
  function logHit(v){
    if (hitDone_) return;   // ★覚えている設定で先に描く→新しい設定で描き直す時に二重に記録しない
    hitDone_ = true;
    try {
      var s = document.createElement('script');
      s.src = EXEC + '?action=hit&who=' + encodeURIComponent(who) +
        '&role=' + encodeURIComponent(role) + '&device=' + encodeURIComponent(device) +
        '&view=' + encodeURIComponent(v) + '&cb=' + Date.now();
      s.onerror = function(){ /* ログ失敗は無視（画面は出す） */ };
      document.body.appendChild(s);
    } catch(e){}
  }

  // 部屋移動が完了した予約は、重いevents.json(約194KB)の再生成・再取得を待たずに
  // 「その場で手元のデータから除外して即再描画」する（体感短縮）。動かした event_id をここへためる。
  window.__movedOut = window.__movedOut || {};
  function detectAndMount_(payload) {
    var evs = payload.events;
    try { evs = evs.filter(function (e) { return !window.__movedOut[e.event_id]; }); } catch (ig) {}
    var res = detect(evs, nail, payload.date_from);
    var sres = detectStaff(evs, payload.date_from);   // 施術者(担当)被りも同じ画面に出す
    mount(renderPage_(res.conflicts, res.meta, payload, nail, base, staff, dev, sres.conflicts));
    try { window.scrollTo(0, 0); } catch (e) {}   // 再描画後は一番上へ（部屋移動の完了更新でも同じ）
    try { if (!window.__keepMvOverlay) { var ov = document.getElementById('mvWaitOverlay'); if (ov && ov.parentNode) ov.parentNode.removeChild(ov); } } catch (e) {}  // 全画面オーバーレイを消す（完了画面を"ぴったり1秒"見せる間は__keepMvOverlayで残す）
  }
  function renderConflictPayload_(payload) {
    try {
      if (!payload || payload.error) { fail('データ取得エラー：' + ((payload && payload.error) || '不明')); return; }
      window.__lastConflictPayload = payload;   // 完了時にこの手元データから即再描画するため保持
      detectAndMount_(payload);
    } catch (e) { fail('描画エラー：' + e); }
  }
  // ★2026-07-17：先読み・裏取りキャッシュの消費は showPrefetchable_（全ボタン共通の土台・下で定義）
  //   に一本化した。被り検出はこの土台を最初に検証した画面＝以前はここに専用の実装があったが、
  //   他のボタンにも同じ理屈を広げる時に共通化し、ここは3行に縮めた。
  function showConflict() { showPrefetchable_('conflict', renderConflictPayload_); }
  // 部屋移動の完了後、ページをリロード（真っ白なリロード画面）せずに検出画面を直接再描画するため公開。
  window.__refreshConflictView = showConflict;
  // ★完了時の即時描画：サーバー再取得をせず、直近に取得済みのpayloadから __movedOut を除外して
  //   描画する（events.json再生成待ちの数秒をまるごと省く）。手元データが無い時だけ従来の再取得へ。
  window.__renderConflictFromCache = function () {
    var p = window.__lastConflictPayload;
    if (!p) { showConflict(); return; }
    try { detectAndMount_(p); } catch (e) { showConflict(); }
  };

  // ★★2026-07-17：全ボタン共通「先読み・裏取りキャッシュを使って即描画する」土台。
  //   ページ冒頭の早期スクリプト（window.__PF_・window.__SZ_VIEWS_）と対になっている。
  //   新しいボタンを足す時は、早期スクリプトのVIEWS表に1行足し、この関数でshowXxx()を
  //   3行で書けば、先読み・裏取り・ちらつき防止（同じ中身なら描き直さない）が全部乗る。
  function showPrefetchable_(view, onPayload) {
    var entry = window.__PF_ && window.__PF_[view];

    function runFresh_() {
      var action = (window.__SZ_VIEWS_ || {})[view];
      var cb = '__ttNow_' + view;
      window[cb] = function (payload) { onPayload(payload); };
      var s = document.createElement('script');
      s.src = EXEC + '?action=data&name=' + action + '&callback=' + cb + '&cb=' + Date.now();
      s.onerror = function () { onPayload({ error: '通信エラーです。通信環境をご確認ください。' }); };
      document.body.appendChild(s);
    }

    if (!entry || entry.done) { runFresh_(); return; }   // 先読みの仕組みが無い/既に使い切り→常に新規取得

    var usedCache = false, cacheStr = null;
    if (entry.cached) {
      cacheStr = JSON.stringify(entry.cached);
      onPayload(entry.cached);
      usedCache = true;
      entry.cached = null;
    }
    function renderIfDifferent(payload) {
      if (!payload || payload.error) return;
      if (cacheStr !== null && JSON.stringify(payload) === cacheStr) return;   // 中身が同じ＝描き直さない
      onPayload(payload);
    }

    if (entry.payload !== undefined) {
      var pe = entry.payload; entry.payload = undefined; entry.done = true;
      if (pe && !pe.error) { renderIfDifferent(pe); return; }
      if (usedCache) return;   // キャッシュを既に表示中＝この失敗は無視してそのまま
      runFresh_();
    } else {
      entry.waiter = function (p) {
        entry.done = true;
        if (p && !p.error) { renderIfDifferent(p); }
        else if (!usedCache) { runFresh_(); }
      };
    }
  }

  // ★記入漏れ画面は「開いている間だけ」5秒ごとに取り直す（2026-07-30）。
  //   スタッフがTimeTreeに入れた予約は、見張り→書き出しが数秒で記入漏れから外すので、
  //   ここで取り直せば入れた直後にその1件がスッと消える。中身が同じ時は描き直さない（ちらつき防止）。
  var __ltTimer = null, __ltLast = null;
  function showLt() {
    if (__ltTimer) { clearInterval(__ltTimer); __ltTimer = null; }
    function draw(payload) {
      if (!payload || payload.error) { fail('データ取得エラー：' + ((payload && payload.error) || '不明')); return; }
      var key = JSON.stringify(payload.action || []);   // 記入漏れの一覧が変わった時だけ描き直す
      if (key === __ltLast) return;
      __ltLast = key;
      mount(renderLtPage_(payload, base, staff, dev));
    }
    showPrefetchable_('lt', function (payload) {
      try { draw(payload); } catch (e) { fail('描画エラー：' + e); }
    });
    __ltTimer = setInterval(function () {
      var cb = '__ltRe_' + Date.now();
      window[cb] = function (p) { try { delete window[cb]; } catch (e) {} try { if (p && !p.error) draw(p); } catch (e) {} };
      var s = document.createElement('script');
      s.src = EXEC + '?action=data&name=lt_match.json&callback=' + cb + '&cb=' + Date.now();
      s.onerror = function () {};
      document.body.appendChild(s);
    }, 5000);
  }

  function renderUriagePayload_(payload) {
    try {
      if (!payload || payload.error) { mount(renderUriageError_((payload && payload.error) || '不明', base, staff, dev)); return; }
      mount(renderUriagePage_(payload, base, staff, dev));
    } catch (e) { fail('描画エラー：' + e); }
  }
  function showUriage() { showPrefetchable_('uriage', renderUriagePayload_); }
  window.__refreshUriageView = showUriage;

  function showUnanswered() {
    showPrefetchable_('unanswered', function (payload) {
      try {
        if (!payload || payload.error) { mount(renderUnansweredError_((payload && payload.error) || '不明', base, staff, dev)); return; }
        mount(renderUnansweredPage_(payload, base, staff, dev));
      } catch (e) { fail('描画エラー：' + e); }
    });

  // IGのDM（開発URL専用）。事務所PCが read_dms.py で書き出した insta_dm.json（既読を付けずに
  //   読んだDM一覧）を窓口(action=data)で取ってきて、renderInstaDmPage_ で並べる。
  // 合言葉から「秘密の置き場所の名前」を作る（事務所PCの read_dms.py と同じ計算）。
  function idmSha24(pw) {
    var enc = new TextEncoder().encode(pw + '|ttinstadm');
    return crypto.subtle.digest('SHA-256', enc).then(function (buf) {
      var a = Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      return a.slice(0, 24);
    });
  }
  // 合言葉で解錠して会話データを取り、いま選んでいる画面（IGのDM or DM再現）を描く。
  function idmFetch(pw) {
    idmSha24(pw).then(function (hex) {
      var cb = '__idm' + Date.now();
      window[cb] = function (payload) {
        try { delete window[cb]; } catch (e) {}
        if (!payload || payload.error || payload.locked || !payload.accounts) {
          lsSet(LS_IDMPW, '');   // 合言葉が違う＝秘密の名前が見つからない
          try { mount(renderInstaDmGate_('合言葉が違うようです。もう一度入れてください。', base, staff, dev)); } catch (e) {}
          return;
        }
        window.__idmData = payload;   // ★カードを押した時、会話の全文を取り出す元
        var render = window.__idmRender || function (p) { return renderInstaDmPage_(p, base, staff, dev); };
        try { mount(render(payload)); }
        catch (e) { fail('描画エラー：' + e); }
      };
      var s = document.createElement('script');
      s.src = EXEC + '?action=data&name=insta_dm_' + hex + '.json&callback=' + cb + '&cb=' + Date.now();
      s.onerror = function () { try { mount(renderInstaDmGate_('つながりませんでした。通信環境をご確認ください。', base, staff, dev)); } catch (e) {} };
      document.head.appendChild(s);
    })['catch'](function () { try { mount(renderInstaDmGate_('この端末では合言葉を計算できませんでした。', base, staff, dev)); } catch (e) {} });
  }
  window.idmSubmit = function (pw) { pw = (pw || '').trim(); if (!pw) return; lsSet(LS_IDMPW, pw); idmFetch(pw); };
  window.idmClear = function () { lsSet(LS_IDMPW, ''); (window.__idmReshow || showInstaDm)(); };

  //   ★実際に送ってよいかは事務所PCの send_dm.py（reply.json の enabled）が決める＝既定はカギ。
  window.igdmReply = function (account, thread, text, statusFn) {
    var fields = JSON.stringify({ account: account, thread: thread, text: text });
    var cbS = '__idmSub' + Date.now();
    window[cbS] = function (r) {

      if (!r || !r.ok || !r.id) { statusFn((r && r.error) || '送信を受け付けられませんでした'); return; }

  // 初めての人を「承認してから返信」する（承認＝本番操作なので練習モード中は事務所PC側で断られる）。
  window.igdmApproveReply = function (account, name, occ, text, statusFn) {
    var fields = JSON.stringify({ account: account, name: name, occ: occ || 0, text: text });
    var cbS = '__idmApr' + Date.now();
    window[cbS] = function (r) {
      try { delete window[cbS]; } catch (e) {}
      if (!r || !r.ok || !r.id) { statusFn((r && r.error) || '受け付けられませんでした'); return; }
      igdmPoll_(r.id, statusFn, 0);
    };
    var s = document.createElement('script');
    s.src = EXEC + '?action=submit&key=' + encodeURIComponent(EDIT_KEY) +
      '&op=instadm_approve_reply&fields=' + encodeURIComponent(fields) +
      '&device=' + encodeURIComponent(device) + '&callback=' + cbS + '&cb=' + Date.now();
    s.onerror = function () { statusFn('つながりませんでした。'); };
    document.head.appendChild(s);
  };
  function igdmPoll_(id, statusFn, n) {
    if (n > 40) { statusFn('時間がかかっています。あとで会話を更新して確かめてください。'); return; }
    var cb = '__idmSt' + Date.now();
    window[cb] = function (r) {
      try { delete window[cb]; } catch (e) {}
      if (r && r.status && r.status !== 'pending' && r.status !== 'notfound' && r.status !== 'running') {
        statusFn(r.result || (r.status === 'done' ? '送りました' : '送れませんでした'));
        return;
      }
      setTimeout(function () { igdmPoll_(id, statusFn, n + 1); }, 1500);
    };
    var ss = document.createElement('script');
    ss.src = EXEC + '?action=status&key=' + encodeURIComponent(EDIT_KEY) + '&id=' + encodeURIComponent(id) + '&callback=' + cb + '&cb=' + Date.now();
    ss.onerror = function () { setTimeout(function () { igdmPoll_(id, statusFn, n + 1); }, 1500); };
    document.head.appendChild(ss);

  // 「詳細を見る」＝初めての人1件を開いて中身を全部読む依頼→結果(会話JSON)を小窓へ。
  //   （開くので既読が付く＝まるちゃん了承。読むだけ・消さない）。
  window.idmReqDetail = function (acc, name, preview, occ, statusFn, onMsgs) {
    if (typeof occ === 'function') { onMsgs = statusFn; statusFn = occ; occ = 0; }   // 旧呼び出し(occなし)も許す
    var fields = JSON.stringify({ account: acc, name: name, preview: preview, occ: occ || 0 });
    function poll(id, n) {
      if (n > 40) { statusFn('時間がかかっています。もう一度お試しください。'); return; }
      var cb = '__idmRs' + Date.now();
      window[cb] = function (s) {
        try { delete window[cb]; } catch (e) {}
        if (s && s.status && s.status !== 'pending' && s.status !== 'notfound' && s.status !== 'running') {
          if (s.status === 'done') {
            var d = null; try { d = JSON.parse(s.result); } catch (e) {}
            if (d && d.msgs) { statusFn(''); onMsgs(d); } else { statusFn('中身を読めませんでした。'); }
          } else { statusFn(s.result || '読めませんでした。'); }
          return;
        }
        setTimeout(function () { poll(id, n + 1); }, 1500);
      };
      var ss = document.createElement('script');
      ss.src = EXEC + '?action=status&key=' + encodeURIComponent(EDIT_KEY) + '&id=' + encodeURIComponent(id) + '&callback=' + cb + '&cb=' + Date.now();
      ss.onerror = function () { setTimeout(function () { poll(id, n + 1); }, 1500); };
      document.head.appendChild(ss);
    }
    var cbS = '__idmRd' + Date.now();
    window[cbS] = function (r) {
      try { delete window[cbS]; } catch (e) {}
      if (!r || !r.ok || !r.id) { statusFn((r && r.error) || '受け付けられませんでした'); return; }
      poll(r.id, 0);
    };
    var s = document.createElement('script');
    s.src = EXEC + '?action=submit&key=' + encodeURIComponent(EDIT_KEY) +
      '&op=instadm_reqdetail&fields=' + encodeURIComponent(fields) +
      '&device=' + encodeURIComponent(device) + '&callback=' + cbS + '&cb=' + Date.now();
    s.onerror = function () { statusFn('つながりませんでした。'); };
    document.head.appendChild(s);
  };

    input.focus();
  }

  // ★★2026-07-17：ホーム画面に居る間、**その人に見えるボタンだけ**を裏で先取りしておく
  //   （見えないボタン＝権限が無い物は無駄になるだけなので取りに行かない）。ホームの表示自体は
  //   showHome()が既に終わった後にこれを呼ぶので、1ミリ秒も遅くならない。
  //   結果は sessionStorage["sz_prefetch_<ボタン名>"] に保存し、そのボタンを押して画面が
  //   切り替わった時（＝新しいページの早期スクリプト）がこれを消費して即描画する。
  function prefetchForHome_(allow) {
    var VIEWS = window.__SZ_VIEWS_ || {};
    for (var v in VIEWS) {
      if (allow && allow[v] !== true) continue;   // devは allow===null＝全部先取りしてよい
      (function (view, action) {
        var cb = '__ttHomePre_' + view;
        window[cb] = function (payload) {
          if (payload && !payload.error) {
            try {
              sessionStorage.setItem('sz_prefetch_' + view, JSON.stringify({ at: Date.now(), payload: payload }));
            } catch (e) {}
          }
        };
        var s = document.createElement('script');
        s.src = EXEC + '?action=data&name=' + action + '&callback=' + cb + '&cb=' + Date.now();
        s.onerror = function () {};
        document.head.appendChild(s);
      })(v, VIEWS[v]);
    }
  }

  // ===== 起動：タイル設定/権限を取得 → 名前選択 or 画面表示 =====
  function boot(cfg) {
    var people = (cfg && cfg.people) || ['kanbu','ringo','mikan','olive','marron','mango','coconut','reception'];
    var labels = (cfg && cfg.labels) || {};
    var perms  = (cfg && cfg.perms) || null;
    var order  = (cfg && cfg.order) || null;   // ボタンの並び順（自動監視メニュー4で変更可）

    // 端末リセットの合図：この端末が名前を選んだ時刻より後にリセット指示があれば、記憶を消して選び直し。
    // （PCの自動監視メニュー4で「この人を選び直し／全員を選び直し」を押すと合図が立つ。次回起動で効く）
    if (staff && who) {
      var resets = (cfg && cfg.resets) || {};
      var pickedAt = parseInt(lsGet('sz_picked_at') || '0', 10) || 0;
      var need = Math.max(parseInt(resets.all || 0, 10) || 0, parseInt(resets[who] || 0, 10) || 0);
      if (need > pickedAt) {
        lsDel(LS_WHO); lsDel(LS_ROLE); lsDel(LS_LABEL); lsDel('sz_picked_at');
        who = ''; window.__SZ_WHO_ = '';
      }
    }
    // スタッフURLで名前が未選択なら、まず名前を選ばせる（選ぶまで他は出さない）。
    if (staff && !who) { showPicker(people, labels, (cfg && cfg.claimed) || {}); return; }

    // 権限判定は code.js の関数を再利用＝GAS(①)と完全一致。
    var allow = (typeof personPerms_ === 'function')
      ? personPerms_(perms || (typeof defaultPerms_==='function'?defaultPerms_():{}), staff, dev, who) : null;
    var v = view;
    if (typeof viewAllowed_ === 'function' && !viewAllowed_(v, allow)) v = 'home';

    logHit(v);
    if (v === 'lt') showLt();
    else if (v === 'uriage') showUriage();
    else if (v === 'unanswered') showUnanswered();
    else if (v === 'akijikan') showAkijikan();
    else if (v === 'links') showLinks();
    else if (v === 'kanshi') showKanshi();
    else if (v === 'zenjitsu') showZenjitsu();
    else if (v === 'cost') showCost();
    else if (v === 'koukoku') showKoukoku();
    else if (v === 'instadm') showInstaDm();
    else if (v === 'igdm') showIgdm();
    else if (v === 'claudetools') showClaudeTools();
    else if (v === 'timedsend') showTimedSend();
    else if (v === 'yoyaku') showYoyaku();
    else if (v === 'yoyaku_new') showYoyakuNew();
    else if (v === 'yoyaku_kizon') showYoyakuKizon();
    else if (v === 'yoyaku_henkou') showYoyakuHenkou();
    else if (v === 'rireki') showRireki();
    else if (v === 'conflict') showConflict();
    else { showHome(perms, order); prefetchForHome_(allow); }
  }

  // ★events(被りデータ)/tilesettings(権限) はページ冒頭の早期スクリプトで既に発射済み
  //   （重い code.js の読み込みを待たずに約0.6秒早くスタート）。ここでは先読み結果を消費するだけ：
  //   tilesettings が届いていれば即 boot、まだなら届き次第 boot する。events は showConflict が
  //   __prefetchedEvents を使い切りで拾う（初回のみ／部屋移動後などのリフレッシュは新規取得で新鮮）。
  function bootOrGate(cfg) {
    if (staff && !lsGet(LS_PWOK)) { showPwGate(cfg); } else { boot(cfg); }
  }

  // ★★初期表示の最速化（2026-07-17・ユーザー要望「ホーム画面から開いてトップが出るまでを極限まで短く」）
  //   実測：GAS(EXEC)への1往復は**中身に関係なく2.0〜2.5秒**（一番軽い返事でも同じ＝Googleの
  //   往復そのものが遅い。ファイルを読む時間は0.2秒ほどしかない＝GAS側をいくら速くしても縮まない）。
  //   なのに今までは、その返事（誰にどのボタンを見せるか）を**待ってから**ボタンを描いていた。
  //   → **前回の答えをこの端末に覚えておき、待たずに即描く**。新しい答えは裏で届き、
  //     中身が変わっていた時だけ描き直す（ふだんは変わらないので描き直しも起きない）。
  //   ★安全側の注意：覚えている答えが古いと、権限を切ったばかりのボタンが数秒だけ見えうる。
  //     届いた時点で必ず描き直す＝見えるのは最大2〜3秒。名前選択(claimed)・選び直し(resets)も
  //     同じく届いた時点で正しく効く（下の useCfg_ が新しい答えで boot をやり直すため）。
  var LS_CFG = 'sz_cfg';
  var bootedFrom_ = null;
  function useCfg_(cfg, fromCache) {
    var str = JSON.stringify(cfg || {});
    if (bootedFrom_ === str) return;          // 前回と同じ中身＝描き直さない（ふだんはこれ）
    // 通信に失敗した時の空っぽの答えで、せっかく描いた画面を壊さない
    if (!fromCache && (!cfg || !cfg.people) && bootedFrom_ !== null) return;
    bootedFrom_ = str;
    if (!fromCache && cfg && cfg.people) lsSet(LS_CFG, str);
    bootOrGate(cfg || {});
  }
  var cachedCfg_ = lsGet(LS_CFG);
  if (cachedCfg_) { try { useCfg_(JSON.parse(cachedCfg_), true); } catch (e) {} }
  if (window.__tsResult !== undefined) { useCfg_(window.__tsResult, false); }
  else { window.__tsWaiter = function (cfg) { useCfg_(cfg || {}, false); }; }
})();
</script>
</body>
</html>
